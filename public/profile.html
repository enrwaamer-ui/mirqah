
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الملف الشخصي - مِرقاة</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .profile-card {
            max-width: 700px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 20px;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            background: rgba(255, 255, 255, 0.15);
        }

        .profile-header h2 {
            margin: 10px 0 5px;
        }

        .profile-header p {
            margin: 0;
            opacity: 0.8;
        }

        .profile-info {
            display: grid;
            gap: 15px;
        }

        .profile-item {
            padding: 16px 18px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
        }

        .profile-label {
            display: block;
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 6px;
        }

        .profile-value {
            display: block;
            font-size: 17px;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <header class="topbar">

        <div class="logo-small">
            مِرقاة
        </div>

        <a href="dashboard.html">
            الرئيسية
        </a>

    </header>


    <main class="dashboard">

        <h1>
            الملف الشخصي 👤
        </h1>


        <div class="profile-card dashboard-card">

            <div class="profile-header">

                <div class="profile-avatar">
                    👤
                </div>

                <h2 id="profileName">
                    جاري تحميل البيانات...
                </h2>

                <p>
                    بيانات الطالب
                </p>

            </div>


            <div class="profile-info">


                <div class="profile-item">

                    <span class="profile-label">
                        🔢 الرقم الجامعي
                    </span>

                    <span
                        class="profile-value"
                        id="profileStudentId">
                        -
                    </span>

                </div>


                <div class="profile-item">

                    <span class="profile-label">
                        📧 البريد الإلكتروني
                    </span>

                    <span
                        class="profile-value"
                        id="profileEmail">
                        -
                    </span>

                </div>


                <div class="profile-item">

                    <span class="profile-label">
                        📚 التخصص
                    </span>

                    <span
                        class="profile-value"
                        id="profileMajor">
                        -
                    </span>

                </div>


                <div class="profile-item">

                    <span class="profile-label">
                        🏫 الجامعة
                    </span>

                    <span
                        class="profile-value"
                        id="profileUniversity">
                        -
                    </span>

                </div>


                <div class="profile-item">

                    <span class="profile-label">
                        📅 السنة الدراسية
                    </span>

                    <span
                        class="profile-value"
                        id="profileYear">
                        -
                    </span>

                </div>


            </div>

        </div>

    </main>


    <script>

        const token = localStorage.getItem("token");


        // =========================
        // التأكد من تسجيل الدخول
        // =========================

        if (!token) {

            window.location.href = "index.html";

        } else {

            // =========================
            // جلب بيانات الطالب
            // =========================

            fetch("/students/me", {

                method: "GET",

                headers: {
                    "Authorization": `Bearer ${token}`
                }

            })

            .then(async response => {

                const data = await response.json();

                if (!response.ok) {

                    throw new Error(
                        data.error || "حدث خطأ في تحميل بيانات الطالب"
                    );

                }

                return data;

            })

            .then(student => {

                // الاسم

                document.getElementById("profileName").textContent =
                    student.name || "غير متوفر";


                // الرقم الجامعي

                document.getElementById("profileStudentId").textContent =
                    student.student_id || "غير متوفر";


                // البريد الإلكتروني

                document.getElementById("profileEmail").textContent =
                    student.email || "غير متوفر";


                // التخصص

                document.getElementById("profileMajor").textContent =
                    student.major || "غير متوفر";


                // الجامعة

                document.getElementById("profileUniversity").textContent =
                    student.university || "غير متوفر";


                // السنة الدراسية

                document.getElementById("profileYear").textContent =
                    student.academic_year || "غير متوفر";


                // تحديث بيانات الطالب المحلية
                // بدون الاعتماد عليها في جلب البيانات

                localStorage.setItem(
                    "student",
                    JSON.stringify(student)
                );

            })

            .catch(error => {

                console.error("Profile error:", error);


                document.getElementById("profileName").textContent =
                    "تعذر تحميل بيانات الطالب";


                document.getElementById("profileStudentId").textContent =
                    "غير متوفر";


                document.getElementById("profileEmail").textContent =
                    "غير متوفر";


                document.getElementById("profileMajor").textContent =
                    "غير متوفر";


                document.getElementById("profileUniversity").textContent =
                    "غير متوفر";


                document.getElementById("profileYear").textContent =
                    "غير متوفر";

            });

        }

    </script>


</body>

</html>
