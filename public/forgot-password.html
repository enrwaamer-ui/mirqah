<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نسيت كلمة المرور - مِرقاة</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="logo">
                مِرقاة
            </div>

            <p class="slogan">
                مش لازم توصل اليوم، المهم إنك ما توقفش.
            </p>

            <h2>
                نسيت كلمة المرور؟
            </h2>

            <p style="margin-bottom: 25px; color: #777;">
                أدخل بريدك الإلكتروني وكلمة المرور الجديدة.
            </p>


            <form id="forgotPasswordForm">

                <label>
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="أدخل بريدك الإلكتروني"
                    required
                >


                <label>
                    كلمة المرور الجديدة
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="أدخل كلمة المرور الجديدة"
                    required
                >


                <label>
                    تأكيد كلمة المرور
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="أعد كتابة كلمة المرور"
                    required
                >


                <button type="submit">
                    تغيير كلمة المرور
                </button>


                <p id="forgotMessage"></p>

            </form>


            <p style="text-align: center; margin-top: 20px;">

                <a href="index.html">
                    العودة لتسجيل الدخول
                </a>

            </p>

        </div>

    </div>


    <script src="forgot-password.js"></script>

</body>

</html>
