<div class="login-page">

    <div class="login-card">

        <div class="logo">
            مِرقاة
        </div>

        <p class="slogan">
            مش لازم توصل اليوم المهم ماتوقفش
        </p>

        <h2>
            إنشاء حساب جديد
        </h2>

        <form id="registerForm">

            <label>الاسم</label>
            <input
                type="text"
                id="name"
                placeholder="أدخل اسمك"
                required
            >

            <label>رقم الطالب</label>
            <input
                type="text"
                id="student_id"
                placeholder="أدخل رقم الطالب"
                required
            >

            <label>البريد الإلكتروني</label>
            <input
                type="email"
                id="email"
                placeholder="أدخل بريدك الإلكتروني"
                required
            >

            <label>كلمة المرور</label>
            <input
                type="password"
                id="password"
                placeholder="أدخل كلمة المرور"
                required
            >

            <label>التخصص</label>
            <input
                type="text"
                id="major"
                placeholder="مثال: هندسة البرمجيات"
                required
            >

            <label>الجامعة</label>
            <input
                type="text"
                id="university"
                placeholder="أدخل اسم الجامعة"
                required
            >

            <label>السنة الدراسية</label>
            <input
                type="number"
                id="academic_year"
                placeholder="مثال: 3"
                required
            >

            <button type="submit">
                إنشاء الحساب
            </button>

            <p id="registerMessage"></p>

        </form>

        <p style="text-align: center; margin-top: 20px;">
            عندك حساب بالفعل؟

            <a href="index.html">
                تسجيل الدخول
            </a>
        </p>

    </div>

</div>

<script>
    document.getElementById("registerForm").addEventListener("submit", async function (event) {

        event.preventDefault();

        const message = document.getElementById("registerMessage");

        const name = document.getElementById("name").value.trim();
        const student_id = document.getElementById("student_id").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const major = document.getElementById("major").value.trim();
        const university = document.getElementById("university").value.trim();
        const academic_year = document.getElementById("academic_year").value;

        message.textContent = "جاري إنشاء الحساب...";

        try {

            const response = await fetch("/students/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name,
                    student_id: student_id,
                    email: email,
                    password: password,
                    major: major,
                    university: university,
                    academic_year: academic_year
                })
            });

            const data = await response.json();

            if (!response.ok) {
                message.textContent = data.error || "حدث خطأ أثناء إنشاء الحساب";
                return;
            }
