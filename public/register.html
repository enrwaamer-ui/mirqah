<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>إنشاء حساب - مِرقاة</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<div class="login-page">

    <div class="login-card">

        <div class="logo">
            مِرقاة
        </div>

        <p class="slogan">
            مش لازم توصل اليوم المهم ماتوقفش
        </p>

        <h2>
            إنشاء حساب جديد
        </h2>

        <form id="registerForm">

            <label>الاسم</label>
            <input
                type="text"
                id="name"
                placeholder="أدخل اسمك"
                required
            >

            <label>رقم الطالب</label>
            <input
                type="text"
                id="student_id"
                placeholder="أدخل رقم الطالب"
                required
            >

            <label>البريد الإلكتروني</label>
            <input
                type="email"
                id="email"
                placeholder="أدخل بريدك الإلكتروني"
                required
            >

            <label>كلمة المرور</label>
            <input
                type="password"
                id="password"
                placeholder="أدخل كلمة المرور"
                required
            >

            <label>التخصص</label>
            <input
                type="text"
                id="major"
                placeholder="مثال: هندسة البرمجيات"
                required
            >

            <label>الجامعة</label>
            <input
                type="text"
                id="university"
                placeholder="أدخل اسم الجامعة"
                required
            >

            <label>السنة الدراسية</label>
            <input
                type="number"
                id="academic_year"
                placeholder="مثال: 3"
                required
            >

            <label>رقم القيد</label>
            <input
                type="text"
                id="seat_number"
                placeholder="أدخل رقم القيد"
                required
            >

            <button type="submit">
                إنشاء الحساب
            </button>

            <p id="registerMessage"></p>

        </form>

        <p style="text-align: center; margin-top: 20px;">

            عندك حساب بالفعل؟

            <a href="index.html">
                تسجيل الدخول
            </a>

        </p>

    </div>

</div>

<script src="register.js"></script>
```

</body>

</html>
