
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إدارة المحاضرات - مِرقاة</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .admin-container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .admin-card {
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 20px;
        }

        .admin-card h1,
        .admin-card h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .add-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            background: #2563eb;
            color: white;
        }

        .add-button:hover {
            opacity: 0.9;
        }

        .lectures-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .lecture-item {
            padding: 20px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.08);

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;
        }

        .lecture-info {
            flex: 1;
        }

        .lecture-info h3 {
            margin: 0 0 10px;
        }

        .lecture-info p {
            margin: 6px 0;
            opacity: 0.85;
        }

        .delete-button {
            display: block;
            flex-shrink: 0;

            border: none;
            padding: 12px 18px;

            border-radius: 10px;

            cursor: pointer;

            background: #dc2626;
            color: white;

            font-size: 15px;
            font-weight: bold;
        }

        .delete-button:hover {
            opacity: 0.85;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            opacity: 0.7;
            padding: 20px;
        }

        .loading {
            text-align: center;
            opacity: 0.7;
            padding: 20px;
        }

        .logout-button {
            margin-right: 15px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 15px;
        }

        @media (max-width: 600px) {
            .lecture-item {
                flex-direction: column;
                align-items: stretch;
            }

            .delete-button {
                width: 100%;
            }
        }
    </style>
</head>


<body>

<header class="topbar">

    <div class="logo-small">
        مِرقاة
    </div>

    <a href="dashboard.html">
        الرئيسية
    </a>

</header>


<main class="admin-container">


    <!-- ========================================= -->
    <!-- إضافة محاضرة -->
    <!-- ========================================= -->

    <div class="admin-card dashboard-card">

        <h1>
            🎓 إدارة المحاضرات
        </h1>

        <p>
            من هنا يقدر الأدمن يضيف محاضرات للطلاب المسجلين في المواد.
        </p>


        <form id="lectureForm">


            <!-- الطالب -->

            <div class="form-group">

                <label for="studentId">
                    👨‍🎓 الطالب
                </label>

                <select
                    id="studentId"
                    required
                >

                    <option value="">
                        جاري تحميل الطلاب...
                    </option>

                </select>

            </div>


            <!-- المادة -->

            <div class="form-group">

                <label for="subjectId">
                    📚 المادة
                </label>

                <select
                    id="subjectId"
                    required
                >

                    <option value="">
                        جاري تحميل المواد...
                    </option>

                </select>

            </div>


            <!-- عنوان المحاضرة -->

            <div class="form-group">

                <label for="lectureTitle">
                    📝 عنوان المحاضرة
                </label>

                <input
                    type="text"
                    id="lectureTitle"
                    placeholder="مثلاً: المحاضرة الثالثة"
                    required
                >

            </div>


            <!-- التاريخ -->

            <div class="form-group">

                <label for="lectureDate">
                    📅 التاريخ
                </label>

                <input
                    type="date"
                    id="lectureDate"
                    required
                >

            </div>


            <!-- وقت البداية -->

            <div class="form-group">

                <label for="startTime">
                    🕐 وقت البداية
                </label>

                <input
                    type="time"
                    id="startTime"
                    required
                >

            </div>


            <!-- وقت النهاية -->

            <div class="form-group">

                <label for="endTime">
                    🕐 وقت النهاية
                </label>

                <input
                    type="time"
                    id="endTime"
                    required
                >

            </div>


            <!-- القاعة -->

            <div class="form-group">

                <label for="hall">
                    🏫 القاعة
                </label>

                <input
                    type="text"
                    id="hall"
                    placeholder="مثلاً: قاعة 3"
                    required
                >

            </div>


            <button
                type="submit"
                class="add-button"
            >
                ➕ إضافة المحاضرة
            </button>

        </form>


        <div
            id="message"
            class="message"
        ></div>

    </div>



    <!-- ========================================= -->
    <!-- المحاضرات الموجودة -->
    <!-- ========================================= -->

    <div class="admin-card dashboard-card">

        <h2>
            📋 جميع المحاضرات
        </h2>


        <div
            id="lecturesList"
            class="lectures-list"
        >

            <p class="loading">
                جاري تحميل المحاضرات...
            </p>

        </div>

    </div>


</main>


<script>


// ==========================================
// العناصر
// ==========================================

const lectureForm =
    document.getElementById("lectureForm");

const studentId =
    document.getElementById("studentId");

const subjectId =
    document.getElementById("subjectId");

const lectureTitle =
    document.getElementById("lectureTitle");

const lectureDate =
    document.getElementById("lectureDate");

const startTime =
    document.getElementById("startTime");

const endTime =
    document.getElementById("endTime");

const hall =
    document.getElementById("hall");

const lecturesList =
    document.getElementById("lecturesList");

const message =
    document.getElementById("message");


// ==========================================
// التوكن
// ==========================================

const token =
    localStorage.getItem("token");


if (!token) {

    window.location.href = "index.html";

}


// ==========================================
// Headers
// ==========================================

function authHeaders() {

    return {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
    };

}


// ==========================================
// التحقق من الأدمن
// ==========================================

async function checkAdmin() {

    try {

        const response =
            await fetch("/students/me", {
                headers: {
                    "Authorization":
                        `Bearer ${token}`
                }
            });


        if (!response.ok) {

            throw new Error(
                "جلسة الدخول غير صالحة"
            );

        }


        const student =
            await response.json();


        if (student.role !== "admin") {

            alert(
                "ليس لديك صلاحية الدخول إلى صفحة الإدارة"
            );

            window.location.href =
                "dashboard.html";

            return false;
        }


        return true;


    } catch (error) {

        console.error(
            "Admin verification error:",
            error
        );

        localStorage.removeItem("token");
        localStorage.removeItem("student");

        window.location.href =
            "index.html";

        return false;
    }

}


// ==========================================
// تحميل الطلاب
// ==========================================

async function loadStudents() {

    try {

        const response =
            await fetch("/students", {
                headers: {
                    "Authorization":
                        `Bearer ${token}`
                }
            });


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "فشل تحميل الطلاب"
            );

        }


        studentId.innerHTML = `
            <option value="">
                اختاري الطالب
            </option>
        `;


        if (
            !Array.isArray(data) ||
            data.length === 0
        ) {

            studentId.innerHTML = `
                <option value="">
                    مافيش طلاب
                </option>
            `;

            return;
        }


        data.forEach(student => {

            const option =
                document.createElement("option");


            option.value =
                student.id;


            const name =
                student.name ||
                "بدون اسم";


            const number =
                student.student_id ||
                "بدون رقم";


            option.textContent =
                `${name} - رقم الطالب: ${number}`;


            studentId.appendChild(option);

        });


    } catch (error) {

        console.error(error);


        studentId.innerHTML = `
            <option value="">
                ❌ حدث خطأ في تحميل الطلاب
            </option>
        `;

    }

}


// ==========================================
// تحميل المواد
// ==========================================

async function loadSubjects() {

    try {

        const response =
            await fetch(
                "/subjects/admin/all",
                {
                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "فشل تحميل المواد"
            );

        }


        subjectId.innerHTML = `
            <option value="">
                اختاري المادة
            </option>
        `;


        if (
            !Array.isArray(data) ||
            data.length === 0
        ) {

            subjectId.innerHTML = `
                <option value="">
                    مافيش مواد مضافة
                </option>
            `;

            return;
        }


        data.forEach(subject => {

            const option =
                document.createElement("option");


            option.value =
                subject.id;


            option.textContent =
                `${subject.name} - ${subject.code}`;


            subjectId.appendChild(option);

        });


    } catch (error) {

        console.error(error);


        subjectId.innerHTML = `
            <option value="">
                ❌ حدث خطأ في تحميل المواد
            </option>
        `;

    }

}


// ==========================================
// تحميل جميع المحاضرات
// ==========================================

async function loadLectures() {

    try {

        lecturesList.innerHTML = `
            <p class="loading">
                جاري تحميل المحاضرات...
            </p>
        `;


        const response =
            await fetch(
                "/lectures/admin/all",
                {
                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "فشل تحميل المحاضرات"
            );

        }


        lecturesList.innerHTML = "";


        if (
            !Array.isArray(data) ||
            data.length === 0
        ) {

            lecturesList.innerHTML = `
                <p class="empty">
                    مافيش محاضرات مضافة حالياً.
                </p>
            `;

            return;
        }


        data.forEach(lecture => {

            const item =
                document.createElement("div");


            item.className =
                "lecture-item";


            item.innerHTML = `

                <div class="lecture-info">

                    <h3>
                        🎓 ${lecture.title || "بدون عنوان"}
                    </h3>

                    <p>
                        👨‍🎓 الطالب:
                        ${lecture.student_name || "بدون اسم"}
                    </p>

                    <p>
                        🔢 رقم الطالب:
                        ${lecture.student_number || "غير متوفر"}
                    </p>

                    <p>
                        📚 المادة:
                        ${lecture.subject_name || "غير محددة"}
                    </p>

                    <p>
                        📅 التاريخ:
                        ${lecture.lecture_date || "غير محدد"}
                    </p>

                    <p>
                        🕐 الوقت:
                        ${lecture.start_time || "--"}
                        -
                        ${lecture.end_time || "--"}
                    </p>

                    <p>
                        🏫 القاعة:
                        ${lecture.hall || "غير محددة"}
                    </p>

                </div>


                <button
                    type="button"
                    class="delete-button"
                    onclick="deleteLecture(${lecture.id})"
                >
                    🗑️ حذف المحاضرة
                </button>

            `;


            lecturesList.appendChild(item);

        });


    } catch (error) {

        console.error(error);


        lecturesList.innerHTML = `
            <p class="empty">
                ❌ ${error.message}
            </p>
        `;

    }

}


// ==========================================
// إضافة محاضرة للأدمن
// ==========================================

lectureForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        // التأكد من اختيار الطالب

        if (!studentId.value) {

            message.textContent =
                "❌ لازم تختاري الطالب.";

            return;
        }


        // التأكد من اختيار المادة

        if (!subjectId.value) {

            message.textContent =
                "❌ لازم تختاري المادة.";

            return;
        }


        // التأكد من الوقت

        if (
            endTime.value <=
            startTime.value
        ) {

            message.textContent =
                "❌ وقت النهاية لازم يكون بعد وقت البداية.";

            return;
        }


        message.textContent =
            "جاري إضافة المحاضرة...";


        try {

            const response =
                await fetch(
                    "/lectures/admin",
                    {
                        method: "POST",

                        headers:
                            authHeaders(),

                        body: JSON.stringify({

                            student_id:
                                studentId.value,

                            subject_id:
                                subjectId.value,

                            title:
                                lectureTitle.value.trim(),

                            lecture_date:
                                lectureDate.value,

                            start_time:
                                startTime.value,

                            end_time:
                                endTime.value,

                            hall:
                                hall.value.trim()

                        })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "حدث خطأ أثناء إضافة المحاضرة"
                );

            }


            message.textContent =
                "✅ تمت إضافة المحاضرة للطالب بنجاح";


            lectureForm.reset();


            await loadLectures();


        } catch (error) {

            console.error(error);


            message.textContent =
                "❌ " + error.message;

        }

    }
);


// ==========================================
// حذف محاضرة
// ==========================================

async function deleteLecture(id) {

    const confirmed =
        confirm(
            "⚠️ هل متأكدة إنك تبي تحذفي هذه المحاضرة؟"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                `/lectures/admin/${id}`,
                {
                    method: "DELETE",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "حدث خطأ أثناء حذف المحاضرة"
            );

        }


        message.textContent =
            "✅ تم حذف المحاضرة بنجاح";


        await loadLectures();


    } catch (error) {

        console.error(error);


        message.textContent =
            "❌ " + error.message;

    }

}


// ==========================================
// تشغيل الصفحة
// ==========================================

async function initPage() {

    const isAdmin =
        await checkAdmin();


    if (!isAdmin) {
        return;
    }


    await Promise.all([
        loadStudents(),
        loadSubjects(),
        loadLectures()
    ]);

}


initPage();


</script>

</body>

</html>
