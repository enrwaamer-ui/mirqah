<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إدارة الامتحانات - مِرقاة</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .header {
            background: #ffffff;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .header h1 {
            margin: 0 0 8px;
        }

        .header p {
            margin: 0;
            color: #666;
        }

        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field label {
            margin-bottom: 7px;
            font-weight: bold;
        }

        .field input,
        .field select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            width: 100%;
        }

        .button-container {
            margin-top: 20px;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .add-btn {
            background: #198754;
            color: white;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            padding: 8px 14px;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .success {
            display: block;
            background: #d1e7dd;
            color: #0f5132;
        }

        .error {
            display: block;
            background: #f8d7da;
            color: #842029;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #eee;
            text-align: center;
        }

        th {
            background: #f1f3f5;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        .back-btn {
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
            background: #6c757d;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .logout-btn {
            display: inline-block;
            margin-top: 10px;
            margin-right: 8px;
            border: none;
            background: #dc3545;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                width: 92%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📚 إدارة الامتحانات</h1>

        <p>
            إضافة وحذف الامتحانات لجميع الطلاب
        </p>

        <a href="dashboard.html" class="back-btn">
            العودة للوحة التحكم
        </a>

        <button
            class="logout-btn"
            onclick="logout()">
            تسجيل الخروج
        </button>
    </div>


    <!-- إضافة امتحان -->

    <div class="card">

        <h2>➕ إضافة امتحان جديد</h2>

        <div class="form-grid">

            <div class="field">

                <label for="student">
                    الطالب
                </label>

                <select id="student">

                    <option value="">
                        جاري تحميل الطلاب...
                    </option>

                </select>

            </div>


            <div class="field">

                <label for="subject">
                    المادة
                </label>

                <select id="subject">

                    <option value="">
                        جاري تحميل المواد...
                    </option>

                </select>

            </div>


            <div class="field">

                <label for="examDate">
                    تاريخ الامتحان
                </label>

                <input
                    type="date"
                    id="examDate"
                >

            </div>


            <div class="field">

                <label for="startTime">
                    وقت الامتحان
                </label>

                <input
                    type="time"
                    id="startTime"
                >

            </div>


            <div class="field">

                <label for="hall">
                    القاعة
                </label>

                <input
                    type="text"
                    id="hall"
                    placeholder="مثال: قاعة 101"
                >

            </div>

        </div>


        <div class="button-container">

            <button
                class="add-btn"
                onclick="addExam()">

                إضافة الامتحان

            </button>

        </div>


        <div
            id="message"
            class="message">
        </div>

    </div>


    <!-- قائمة الامتحانات -->

    <div class="card">

        <h2>
            📋 جميع الامتحانات
        </h2>

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            الطالب
                        </th>

                        <th>
                            رقم الطالب
                        </th>

                        <th>
                            المادة
                        </th>

                        <th>
                            التاريخ
                        </th>

                        <th>
                            الوقت
                        </th>

                        <th>
                            القاعة
                        </th>

                        <th>
                            حذف
                        </th>

                    </tr>

                </thead>


                <tbody id="examsTable">

                    <tr>

                        <td
                            colspan="7"
                            class="empty">

                            جاري تحميل الامتحانات...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

const token = localStorage.getItem("token");

const studentSelect =
    document.getElementById("student");

const subjectSelect =
    document.getElementById("subject");

const examsTable =
    document.getElementById("examsTable");

const message =
    document.getElementById("message");


// =====================================
// التحقق من تسجيل الدخول والصلاحية
// =====================================

async function checkAdmin() {

    if (!token) {

        window.location.href = "index.html";

        return false;
    }

    try {

        const response =
            await fetch("/students/me", {

                headers: {
                    "Authorization":
                        "Bearer " + token
                }

            });


        if (!response.ok) {

            localStorage.removeItem("token");
            localStorage.removeItem("student");

            window.location.href =
                "index.html";

            return false;
        }


        const student =
            await response.json();


        if (student.role !== "admin") {

            alert(
                "ليس لديك صلاحية دخول هذه الصفحة"
            );

            window.location.href =
                "dashboard.html";

            return false;
        }


        return true;

    } catch (error) {

        console.error(
            "Admin check error:",
            error
        );

        window.location.href =
            "index.html";

        return false;
    }
}


// =====================================
// Headers
// =====================================

function authHeaders() {

    return {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
    };

}


// =====================================
// إظهار رسالة
// =====================================

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

    setTimeout(() => {

        message.className =
            "message";

    }, 4000);

}


// =====================================
// تحميل الطلاب
// =====================================

async function loadStudents() {

    try {

        const response =
            await fetch(
                "/students",
                {
                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "فشل تحميل الطلاب"
            );

        }


        const students =
            await response.json();


        studentSelect.innerHTML =
            '<option value="">اختاري الطالب</option>';


        if (
            !Array.isArray(students) ||
            students.length === 0
        ) {

            studentSelect.innerHTML =
                '<option value="">لا يوجد طلاب</option>';

            return;
        }


        students.forEach(student => {

            const option =
                document.createElement("option");


            option.value =
                student.id;


            const studentName =
                student.name ||
                student.full_name ||
                "بدون اسم";


            const studentNumber =
                student.student_id ||
                student.student_id_number ||
                student.student_number ||
                "-";


            option.textContent =
                studentName +
                " - " +
                studentNumber;


            studentSelect.appendChild(option);

        });

    } catch (error) {

        console.error(
            "Load students error:",
            error
        );


        studentSelect.innerHTML =
            '<option value="">حدث خطأ في تحميل الطلاب</option>';

    }

}


// =====================================
// تحميل المواد
// =====================================

async function loadSubjects() {

    try {

        const response =
            await fetch(
                "/subjects/admin/all",
                {
                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "فشل تحميل المواد"
            );

        }


        const data =
            await response.json();


        const subjects =
            Array.isArray(data)
                ? data
                : data.subjects || [];


        subjectSelect.innerHTML =
            '<option value="">اختاري المادة</option>';


        if (subjects.length === 0) {

            subjectSelect.innerHTML =
                '<option value="">لا توجد مواد</option>';

            return;
        }


        subjects.forEach(subject => {

            const option =
                document.createElement("option");


            option.value =
                subject.id;


            option.textContent =
                subject.name +
                (
                    subject.code
                        ? " - " + subject.code
                        : ""
                );


            subjectSelect.appendChild(option);

        });

    } catch (error) {

        console.error(
            "Load subjects error:",
            error
        );


        subjectSelect.innerHTML =
            '<option value="">حدث خطأ في تحميل المواد</option>';

    }

}


// =====================================
// تحميل الامتحانات
// =====================================

async function loadExams() {

    try {

        const response =
            await fetch(
                "/exams/admin/all",
                {
                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "فشل تحميل الامتحانات"
            );

        }


        const data =
            await response.json();


        const exams =
            Array.isArray(data)
                ? data
                : data.exams || [];


        examsTable.innerHTML = "";


        if (exams.length === 0) {

            examsTable.innerHTML = `
                <tr>
                    <td colspan="7" class="empty">
                        لا توجد امتحانات حالياً
                    </td>
                </tr>
            `;

            return;
        }


        exams.forEach(exam => {

            const row =
                document.createElement("tr");


            const date =
                exam.exam_date
                    ? new Date(
                        exam.exam_date
                    ).toLocaleDateString("ar-LY")
                    : "-";


            const studentName =
                exam.student_name ||
                exam.name ||
                "بدون اسم";


            const studentNumber =
                exam.student_id_number ||
                exam.student_number ||
                exam.student_id ||
                "-";


            const subjectName =
                exam.subject_display_name ||
                exam.subject_name ||
                "-";


            row.innerHTML = `

                <td>
                    ${studentName}
                </td>

                <td>
                    ${studentNumber}
                </td>

                <td>
                    ${subjectName}
                </td>

                <td>
                    ${date}
                </td>

                <td>
                    ${exam.start_time || "-"}
                </td>

                <td>
                    ${exam.hall || "-"}
                </td>

                <td>

                    <button
                        class="delete-btn"
                        onclick="deleteExam(${exam.id})">

                        حذف

                    </button>

                </td>

            `;


            examsTable.appendChild(row);

        });


    } catch (error) {

        console.error(
            "Load exams error:",
            error
        );


        examsTable.innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    حدث خطأ أثناء تحميل الامتحانات
                </td>
            </tr>
        `;

    }

}


// =====================================
// إضافة امتحان
// =====================================

async function addExam() {

    const studentId =
        studentSelect.value;


    const subjectId =
        subjectSelect.value;


    const examDate =
        document.getElementById(
            "examDate"
        ).value;


    const startTime =
        document.getElementById(
            "startTime"
        ).value;


    const hall =
        document.getElementById(
            "hall"
        ).value.trim();


    if (!studentId) {

        showMessage(
            "اختاري الطالب أولاً",
            "error"
        );

        return;
    }


    if (!subjectId) {

        showMessage(
            "اختاري المادة أولاً",
            "error"
        );

        return;
    }


    if (!examDate) {

        showMessage(
            "اختاري تاريخ الامتحان",
            "error"
        );

        return;
    }


    if (!startTime) {

        showMessage(
            "اختاري وقت الامتحان",
            "error"
        );

        return;
    }


    if (!hall) {

        showMessage(
            "اكتبي القاعة",
            "error"
        );

        return;
    }


    try {

        const response =
            await fetch(
                "/exams/admin",
                {
                    method: "POST",

                    headers:
                        authHeaders(),

                    body:
                        JSON.stringify({

                            student_id:
                                Number(studentId),

                            subject_id:
                                Number(subjectId),

                            exam_date:
                                examDate,

                            start_time:
                                startTime,

                            hall:
                                hall

                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "فشل إضافة الامتحان"
            );

        }


        showMessage(
            "تمت إضافة الامتحان بنجاح ✅",
            "success"
        );


        studentSelect.value = "";

        subjectSelect.value = "";

        document.getElementById(
            "examDate"
        ).value = "";

        document.getElementById(
            "startTime"
        ).value = "";

        document.getElementById(
            "hall"
        ).value = "";


        loadExams();


    } catch (error) {

        console.error(
            "Add exam error:",
            error
        );


        showMessage(
            error.message ||
            "حدث خطأ أثناء إضافة الامتحان",
            "error"
        );

    }

}


// =====================================
// حذف امتحان
// =====================================

async function deleteExam(id) {

    const confirmed =
        confirm(
            "هل أنتِ متأكدة من حذف هذا الامتحان؟"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                "/exams/admin/" + id,
                {
                    method: "DELETE",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "فشل حذف الامتحان"
            );

        }


        showMessage(
            "تم حذف الامتحان بنجاح ✅",
            "success"
        );


        loadExams();


    } catch (error) {

        console.error(
            "Delete exam error:",
            error
        );


        showMessage(
            error.message ||
            "حدث خطأ أثناء حذف الامتحان",
            "error"
        );

    }

}


// =====================================
// تسجيل الخروج
// =====================================

function logout() {

    localStorage.removeItem("token");

    localStorage.removeItem("student");

    window.location.href =
        "index.html";

}


// =====================================
// تشغيل الصفحة
// =====================================

async function init() {

    const isAdmin =
        await checkAdmin();


    if (!isAdmin) {
        return;
    }


    await Promise.all([
        loadStudents(),
        loadSubjects(),
        loadExams()
    ]);

}


init();

</script>

</body>
</html>
