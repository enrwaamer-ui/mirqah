<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مِرقاة - تسجيل الدخول</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="logo">
                مِرقاة
            </div>

            <p class="slogan">
                مش لازم توصل اليوم، المهم إنك ما توقفش.
            </p>

            <h2>
                تسجيل الدخول
            </h2>


            <form id="loginForm">

                <label>
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="أدخل بريدك الإلكتروني"
                    required
                >


                <label>
                    كلمة المرور
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="أدخل كلمة المرور"
                    required
                >


                <button type="submit">
                    تسجيل الدخول
                </button>


                <p id="loginMessage"></p>

            </form>


            <!-- نسيت كلمة المرور -->

            <p style="text-align: center; margin-top: 15px;">

                <a href="forgot-password.html">
                    نسيت كلمة المرور؟
                </a>

            </p>


            <!-- إنشاء حساب -->

            <p style="text-align: center; margin-top: 15px;">

                ما عندكش حساب؟

                <a href="register.html">
                    إنشاء حساب
                </a>

            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
