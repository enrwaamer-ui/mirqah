<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مِرقاة - المواد</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">

        <div class="logo-small">
            مِرقاة
        </div>

        <button onclick="goBack()">
            ← الرئيسية
        </button>

    </header>


    <main class="dashboard">

        <section class="welcome-card">

            <h1>
                📚 المواد الدراسية
            </h1>

            <p>
                أضف موادك الدراسية وجدولها الخاص بك
            </p>

        </section>


        <!-- إضافة مادة -->

        <section class="dashboard-section">

            <h2>
                ➕ إضافة مادة جديدة
            </h2>

            <form id="addSubjectForm">

                <div style="margin-bottom: 15px;">

                    <label for="subjectName">
                        اسم المادة
                    </label>

                    <input
                        type="text"
                        id="subjectName"
                        placeholder="مثال: برمجة متقدمة"
                        required
                        style="width:100%; box-sizing:border-box; padding:12px; margin-top:8px;"
                    >

                </div>


                <div style="margin-bottom: 15px;">

                    <label for="subjectCode">
                        كود المادة
                    </label>

                    <input
                        type="text"
                        id="subjectCode"
                        placeholder="مثال: CS301"
                        style="width:100%; box-sizing:border-box; padding:12px; margin-top:8px;"
                    >

                </div>


                <button
                    type="submit"
                    style="width:100%; padding:12px;"
                >
                    ➕ إضافة المادة
                </button>

            </form>


            <p
                id="subjectMessage"
                style="text-align:center; margin-top:15px;"
            ></p>

        </section>


        <!-- قائمة المواد -->

        <section class="dashboard-section">

            <h2>
                📚 موادي
            </h2>

            <div id="subjectsList">

                <p>
                    جاري تحميل المواد...
                </p>

            </div>

        </section>

    </main>


    <script src="subjects.js"></script>

</body>

</html>
